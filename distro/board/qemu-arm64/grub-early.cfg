set superusers=leon-disabled
export superusers
regexp --set=1:root '^\(([^)]+)\)' "$cmdpath"
set prefix=$cmdpath
configfile $prefix/grub.cfg
echo LEON_BOOT_MENU_UNAVAILABLE
configfile $prefix/recovery.cfg
echo LEON_BOOT_RECOVERY_UNAVAILABLE
echo Attach the standalone LeonMobile recovery disk to repair boot files.
sleep 60
reboot
