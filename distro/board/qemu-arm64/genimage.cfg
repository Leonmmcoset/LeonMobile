image data.ext4 {
    ext4 {
        label = "leon-data"
    }
    size = 512M
    mountpoint = "/data"
}
image leonmobile-qemu-aarch64.img {
    hdimage {
        partition-table-type = "gpt"
    }
    partition system {
        image = "rootfs.ext4"
        partition-type-uuid = "L"
    }
    partition data {
        image = "data.ext4"
        partition-type-uuid = "L"
    }
    partition boot {
        image = "leon-efi.vfat"
        partition-type-uuid = U
        bootable = true
    }
}
image leon-efi.vfat {
    vfat {
        extraargs = "-F 32"
        label = "LEON-BOOT"
        file EFI { image = "leon-efi/EFI" }
    }
    size = 128M
}
image leon-recovery-efi.vfat {
    vfat {
        extraargs = "-F 32"
        label = "LEON-RESCUE"
        file EFI { image = "leon-recovery-efi/EFI" }
    }
    size = 64M
}
image leonmobile-recovery-aarch64.img {
    hdimage { partition-table-type = "gpt" }
    partition recovery {
        image = "leon-recovery-efi.vfat"
        partition-type-uuid = U
        bootable = true
    }
}
