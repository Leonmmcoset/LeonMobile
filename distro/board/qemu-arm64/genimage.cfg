image data.ext4 {
    ext4 {
        label = "leon-data"
    }
    size = 512M
    mountpoint = "/data"
}
image leonmobile-qemu-aarch64.img {
    hdimage {
        partition-table-type = "gpt"
    }
    partition system {
        image = "rootfs.ext4"
        partition-type-uuid = "L"
    }
    partition data {
        image = "data.ext4"
        partition-type-uuid = "L"
    }
}
